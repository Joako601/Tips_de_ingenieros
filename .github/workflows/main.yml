name: main

# Valida el commit que quedó en main después del squash, incluido el mensaje editado al fusionar.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs
      - name: Coautores del commit
        run: git log -1 --format='%(trailers:key=Co-authored-by)' >> "$GITHUB_STEP_SUMMARY"
