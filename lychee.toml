# ACM rechaza con 403 las peticiones automáticas desde el CI; sus DOI son estables por diseño.
# melconway.com no responde a tiempo a los servidores de GitHub de forma intermitente; la página tiene copia archivada.
# sec.gov rechaza con 403 las peticiones desde el CI; la orden de la SEC tiene copia archivada.
# Substack rechaza con 403 las peticiones desde el CI; las referencias tienen copia archivada.
exclude = ['^https://doi\.org/10\.1145/', '^https://dl\.acm\.org/', '^https://www\.melconway\.com/', '^https://[a-z0-9-]+\.substack\.com/', '^https://www\.sec\.gov/']
exclude_path = ['(^|/)node_modules/', '(^|/)\.vale/styles/']
include_fragments = "full"
accept = ["200..=299", "429"]
# web.archive.org responde con 500 y errores de HTTP/2 de forma intermitente cuando recibe muchas peticiones a la vez.
# Se reintenta más veces, con más espera, y esos fallos no se guardan en la caché.
max_retries = 5
retry_wait_time = 5
cache = true
cache_exclude_status = "500.."
max_cache_age = "1d"

# Pocas peticiones a la vez y espaciadas hacia el servidor que más falla, que es donde están las copias archivadas.
[hosts."web.archive.org"]
concurrency = 2
request_interval = "1s"
